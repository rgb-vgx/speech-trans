[project]
name = "speech-trans-server"
version = "0.1.0"
description = "Local GPU pipeline: Udemy English lecture -> Vietnamese subtitles + speech"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.5",
    "numpy>=2.0",
    "faster-whisper>=1.2",
    "transformers==4.57.6",
    "sentencepiece>=0.2",
    "protobuf>=5",
    "safetensors>=0.4",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "vieneu>=3.8.5",
    "silero-vad>=5.1",
    "soundfile>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.uv]
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchaudio = [{ index = "pytorch-cu128" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
